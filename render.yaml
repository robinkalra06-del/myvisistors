databases:
  - name: livetrack-postgres
    databaseName: livetrack
    user: livetrack_user
    plan: free
    region: oregon

services:
  # 1. Backend Web Service (Node.js + Express + Socket.IO)
  - type: web
    name: livetrack-api
    env: node
    plan: free
    region: oregon
    rootDir: .
    buildCommand: npm install && npx prisma generate --schema=apps/api/prisma/schema.prisma
    preDeployCommand: npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma && node apps/api/prisma/seed.js
    startCommand: node apps/api/src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: livetrack-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_URL
        fromService:
          type: web
          name: livetrack-dashboard
          property: host
      - key: API_URL
        sync: false

  # 2. Frontend React / Vite Static Site
  - type: web
    name: livetrack-dashboard
    env: static
    plan: free
    region: oregon
    rootDir: .
    buildCommand: npm install && npm run build --workspace=apps/dashboard
    staticPublishPath: ./apps/dashboard/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: livetrack-api
          property: host
