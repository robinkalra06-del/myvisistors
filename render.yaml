# ========================================================
# Render.com Infrastructure Blueprint for PulseMeet
# ========================================================

databases:
  - name: pulsemeet-postgres
    plan: free
    databaseName: meet_db
    user: pulsemeet

services:
  # 1. PulseMeet Backend Web Service (Node.js + Socket.IO)
  - type: web
    name: pulsemeet-backend
    env: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install && node detect-db.js && npx prisma generate && npx prisma db push && npx tsx prisma/seed.ts && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5001
      - key: DATABASE_URL
        fromDatabase:
          name: pulsemeet-postgres
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CLIENT_URL
        fromService:
          type: web
          name: pulsemeet-frontend
          property: host

  # 2. PulseMeet Frontend (React + Vite SPA)
  - type: web
    name: pulsemeet-frontend
    env: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_SERVER_URL
        fromService:
          type: web
          name: pulsemeet-backend
          property: host
      - key: VITE_API_URL
        fromService:
          type: web
          name: pulsemeet-backend
          property: host
