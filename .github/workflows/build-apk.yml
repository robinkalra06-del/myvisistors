name: Build PulseMeet Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Configure Android SDK & Clean Legacy Plugins
        run: |
          # 1. Align SDK versions
          sed -i 's/compileSdkVersion = 36/compileSdkVersion = 34/g' frontend/android/variables.gradle || true
          sed -i 's/targetSdkVersion = 36/targetSdkVersion = 34/g' frontend/android/variables.gradle || true

          # 2. Strip unused legacy Cordova references that cause Gradle failure
          sed -i '/cordova.variables.gradle/d' frontend/android/app/capacitor.build.gradle || true
          sed -i '/capacitor-cordova-android-plugins/d' frontend/android/settings.gradle || true
          sed -i '/capacitor-cordova-android-plugins/d' frontend/android/app/build.gradle || true

          # 3. Create dummy file to avoid any script missing exceptions
          mkdir -p frontend/android/capacitor-cordova-android-plugins/src/main/libs
          touch frontend/android/capacitor-cordova-android-plugins/cordova.variables.gradle

          # 4. Accept Android licenses
          yes | sdkmanager --licenses || true

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: Build Frontend Web App
        working-directory: frontend
        run: npm run build

      - name: Sync Web Assets into Android App
        working-directory: frontend
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          npx cap sync android || true

      - name: Make Gradle Executable
        run: chmod +x frontend/android/gradlew

      - name: Build Debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload PulseMeet APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PulseMeet-Android-APK
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
