name: Build PulseMeet Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Accept Android Licenses & Fix SDK Version
        run: |
          sed -i 's/compileSdkVersion = 36/compileSdkVersion = 34/g' frontend/android/variables.gradle || true
          sed -i 's/targetSdkVersion = 36/targetSdkVersion = 34/g' frontend/android/variables.gradle || true
          yes | sdkmanager --licenses || true

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install

      - name: Build Frontend Web App
        working-directory: frontend
        run: npm run build

      - name: Sync Capacitor Android
        working-directory: frontend
        run: npx cap sync android

      - name: Make Gradle Executable
        run: chmod +x frontend/android/gradlew

      - name: Build Debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload PulseMeet APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PulseMeet-Android-APK
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
