version: '3.8'

services:
  # 1. Database Service (MySQL)
  db:
    image: mysql:8.0
    container_name: pulsemeet_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: meet_db
      MYSQL_USER: pulsemeet
      MYSQL_PASSWORD: securepassword123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - pulsemeet_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. LiveKit SFU Media Server (Scalable Real-Time Video/Audio)
  livekit:
    image: livekit/livekit-server:latest
    container_name: pulsemeet_livekit
    restart: always
    command: --dev
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    networks:
      - pulsemeet_net

  # 3. PulseMeet Backend API & WebRTC Signaling
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pulsemeet_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5001
      CLIENT_URL: http://localhost:80
      DATABASE_URL: "mysql://pulsemeet:securepassword123@db:3306/meet_db"
      JWT_ACCESS_SECRET: "pulsemeet-prod-access-secret-replace-in-production-2025"
      JWT_REFRESH_SECRET: "pulsemeet-prod-refresh-secret-replace-in-production-2025"
      LIVEKIT_API_KEY: "devkey"
      LIVEKIT_API_SECRET: "secretkeypulsemeet1234567890abcdef"
      LIVEKIT_URL: "ws://livekit:7880"
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - pulsemeet_net

  # 4. PulseMeet Frontend (React + Vite + Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pulsemeet_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - pulsemeet_net

volumes:
  mysql_data:
  backend_uploads:

networks:
  pulsemeet_net:
    driver: bridge
